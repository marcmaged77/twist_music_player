name: twist_music_player
description: Twist music swimlane, mini player, full player and background preview playback for any Flutter app.
version: 0.3.1
repository: https://github.com/marcmaged77/twist_music_player
issue_tracker: https://github.com/marcmaged77/twist_music_player/issues

screenshots:
  - description: The swimlane of preview cards inside a host feed.
    path: screenshots/swimlane.png
  - description: The full player expanded in place with the artwork-tinted background.
    path: screenshots/full_player.png
  - description: The mini player docked above the host's content.
    path: screenshots/mini_player.png
  - description: The download prompt raised on the backend's cadence.
    path: screenshots/download_prompt.png

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  iconsax: ^0.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Playback
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4

  # Lane transport (default source only; hosts may supply their own TwistLaneSource)
  http: ^1.2.0

  # UI
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
